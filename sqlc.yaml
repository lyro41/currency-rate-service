version: "2"
sql:
  - schema: "sql/schema.sql"
    queries: "sql/query.sql"
    engine: "postgresql"
    gen:
      go:
        package: "db"
        sql_package: "pgx/v5"
        out: "internal/db"
        emit_json_tags: true
        overrides:
          - column: "currency_rates.id"
            go_type: "github.com/google/uuid.UUID"
          - column: "currency_rates.status"
            go_type: "github.com/lyro41/plata-go-assignment/internal/api.RateStatus"
