env: production

storage:
  host: postgres
  port: 5432
  user: postgres
  password: postgres
  database: postgres
  timeout: 5s

provider:
  timeout: 5s
  max_attempts: 3
  initial_backoff: 200ms

http_server:
  address: ":8080"
  read_timeout: 5s
  write_timeout: 10s
  idle_timeout: 60s

worker:
  buffer_size: 100
